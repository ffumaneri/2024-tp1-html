<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de la Imagen</title>
    <link rel="stylesheet" href="../CSS/estilos-contact-form.css">
</head>
<body>
    <div class="contact-section">
        <a href="index.html" class="go-back-btn">Volver a la página principal</a>
        <h2>Contacto</h2>
        <p>Si tienes alguna pregunta o necesitas más información, no dudes en ponerte en contacto con nosotros. ¡Estaremos encantados de ayudarte!</p>

        <!-- Formulario de Contacto -->
        <form class="contact-form">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" required>

            <label for="name">Apellido:</label>
            <input type="text" id="lastname" name="lastname" required>

            <label for="name">Tipo/Nombre de flor que desea pedir:</label>
            <input type="text" id="tipo" name="tipo" required>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Descripción del pedido o mensaje adicional:</label>
            <textarea id="message" name="message" rows="4" required></textarea>

            <button type="submit">Enviar Mensaje</button>
        </form>
    </div>
</body>
</html>
