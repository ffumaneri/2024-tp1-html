<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto - Mi Florería</title>
    <link rel="stylesheet" href="stylesflores.css">
</head>
<body>
    <header>
        <h1>Formulario de Contacto</h1>
    </header>

    <section>
        <h2>Realiza tu pedido</h2>
        <form action="#" method="post" class="contact-form">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required>

            <label for="flor">Tipo de flor:</label>
            <select id="flor" name="flor" required>
                <option value="rosa">Rosa</option>
                <option value="petunia">Petunia</option>
                <option value="tulipan">Tulipán</option>
                <option value="gerbera">Gerbera</option>
                <option value="lilium">Lilium</option>
            </select>

            <label for="descripcion">Descripción del pedido:</label>
            <textarea id="descripcion" name="descripcion" rows="4" required></textarea>

            <button type="submit" class="btn-back">Enviar Pedido</button>
        </form>
    </section>

    <footer>
        <a href="index.html" class="btn-back">Volver</a>
    </footer>
</body>
</html>
